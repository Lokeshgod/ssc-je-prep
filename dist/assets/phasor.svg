<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-labelledby="title"><title id="title">Series RL voltage phasor triangle: resistive voltage in phase with current; inductive voltage vertical</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#486744"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#284d3c;font-size:16px}.wire{fill:none;stroke:#486744;stroke-width:2.5}.accent{fill:none;stroke:#9bb568;stroke-width:3}.label{font-size:13px;fill:#708165}</style><path class="wire" d="M155 192h290" marker-end="url(#arrow)"/><path class="wire" d="M445 192V55" marker-end="url(#arrow)"/><path class="accent" d="M155 192L445 55" marker-end="url(#arrow)"/><path d="M215 192A60 60 0 0 0 210 166" fill="none" stroke="#9bb568" stroke-width="2"/><text x="258" y="217">VR = IR (in phase with I)</text><text x="464" y="115">VL = IXL</text><text x="265" y="91">V = VR + jVL</text><text x="222" y="177">φ</text><text class="label" x="212" y="244">Use the vector triangle: |V|² = VR² + VL²</text></svg>