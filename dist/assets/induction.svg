<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-labelledby="title"><title id="title">Power flow from input to air gap to gross mechanical to shaft output, with losses at each stage</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#486744"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#284d3c;font-size:16px}.wire{fill:none;stroke:#486744;stroke-width:2.5}.accent{fill:none;stroke:#9bb568;stroke-width:3}.label{font-size:13px;fill:#708165}</style><rect x="20" y="75" width="130" height="80" rx="8" fill="#e7eedb"/><rect x="215" y="75" width="130" height="80" rx="8" fill="#e7eedb"/><rect x="410" y="75" width="125" height="80" rx="8" fill="#e7eedb"/><rect x="585" y="75" width="100" height="80" rx="8" fill="#d7e5ba"/><g class="wire" marker-end="url(#arrow)"><path d="M150 115h65"/><path d="M345 115h65"/><path d="M535 115h50"/><path d="M180 115v80"/><path d="M374 115v80"/><path d="M559 115v80"/></g><text x="43" y="109">Electrical</text><text x="50" y="132">input</text><text x="231" y="109">Air-gap</text><text x="251" y="132">P₉</text><text x="432" y="109">Gross</text><text x="421" y="132">(1 − s)P₉</text><text x="610" y="109">Shaft</text><text x="605" y="132">output</text><text class="label" x="130" y="218">Stator losses</text><text class="label" x="321" y="218">Rotor loss: sP₉</text><text class="label" x="510" y="218">Mechanical loss</text></svg>